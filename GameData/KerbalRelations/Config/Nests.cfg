// With USI Life Support installed, an egg needs a free seat in a part whose Kolony Growth toggle is
// switched on. USI/MKS only give that toggle to the 'Tundra' Colonization Modules and the 'Atlas'
// Kerbitats. These patches add it to every habitation part that has seats, from any mod.
// The toggle is off by default; switch it on in the editor or in flight.

// Habitation parts with seats.
@PART[*]:HAS[@MODULE[USILS_HabitationSwapOption],!MODULE[USILS_KolonyGrowthModule],#CrewCapacity[>0]]:NEEDS[USILifeSupport]:LAST[KerbalRelations]
{
	MODULE
	{
		name = USILS_KolonyGrowthModule
	}
}

// USI inflatable habitats, which only have seats once deployed.
@PART[*]:HAS[@MODULE[USILS_HabitationSwapOption],!MODULE[USILS_KolonyGrowthModule],@MODULE[USIAnimation]:HAS[#CrewCapacity[>0]]]:NEEDS[USILifeSupport]:LAST[KerbalRelations]
{
	MODULE
	{
		name = USILS_KolonyGrowthModule
	}
}

// Stockalike Station Parts Expansion inflatable and extendable habitats, likewise.
@PART[*]:HAS[@MODULE[USILS_HabitationSwapOption],!MODULE[USILS_KolonyGrowthModule],@MODULE[ModuleDeployableHabitat]:HAS[#DeployedCrewCapacity[>0]]]:NEEDS[USILifeSupport]:LAST[KerbalRelations]
{
	MODULE
	{
		name = USILS_KolonyGrowthModule
	}
}
