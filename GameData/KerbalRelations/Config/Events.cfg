// Random mood events. Each Kerbal gets one every EventMeanIntervalDays on average.
//   id             unique; an event happening again refreshes it rather than stacking
//   text           <<1>> is the Kerbal, <<2>> the other Kerbal involved
//   amount         percentage points of happiness
//   durationDays   default 10
//   condition      Any (anywhere, even at the KSC), Away (not at the KSC), Alone, Company,
//                  Couple (partner present), Parent (own egg or child present)
//   stage          Any, Adult or Child
//   relationDelta  change to the bond with <<2>>
//   mutual         <<2>> gets the same mood change
//   weight         how likely compared to the others, default 1
// Add your own in any .cfg file; other mods can do the same.

// ---------- Anywhere ----------
KR_EVENT
{
	id = Birthday
	text = Had a birthday and got an awesome present
	amount = 10
	durationDays = 15
}
KR_EVENT
{
	id = GoodSleep
	text = Slept like a rock
	amount = 4
	durationDays = 5
}
