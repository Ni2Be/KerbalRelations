// What happiness does. Each key is "happiness multiplier"; values in between are interpolated.
// Give each effect its own mapping by changing its keys.
//
// Other mods: add a KR_EFFECT with your own name and ask for the multiplier with
//   KerbalRelationsAPI.GetMultiplier(kerbalName, "YourEffect")
// An effect without a node uses 0.5x at 0 %, 1x at 100 %, 2x at 200 %.

// Walking, running, swimming and climbing speed on EVA.
KR_EFFECT
{
	name = RunSpeed
	key = 0 0.5
	key = 100 1
	key = 200 2
}

// Science per day produced by scientists in a lab.
KR_EFFECT
{
	name = Research
	key = 0 0.5
	key = 100 1
	key = 200 2
}

// Experience gained from flights.
KR_EFFECT
{
	name = Experience
	key = 0 0.5
	key = 100 1
	key = 200 2
}
