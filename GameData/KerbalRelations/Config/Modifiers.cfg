// Mood changes tied to things that happen in the game.
//   amount        percentage points of happiness
//   durationDays  how long it lasts; it fades out over the last quarter
//   text          <<1>> is the Kerbal, <<2>> the planet or the other Kerbal
// A new modifier with the same id replaces the old one instead of stacking.

KR_MODIFIER
{
	id = NewSoiFirst
	text = Reached <<2>> for the first time
	amount = 20
	durationDays = 30
}
KR_MODIFIER
{
	id = NewSoi
	text = Arrived at <<2>>
	amount = 8
	durationDays = 10
}
KR_MODIFIER
{
	id = LandedFirst
	text = First landing on <<2>>
	amount = 25
	durationDays = 40
}
KR_MODIFIER
{
	id = Landed
	text = Landed on <<2>>
	amount = 10
	durationDays = 15
}
KR_MODIFIER
{
	id = ReturnedHome
	text = Back home
	amount = 20
	durationDays = 30
}
KR_MODIFIER
{
	id = LevelUp
	text = Got promoted
	amount = 10
	durationDays = 20
}
KR_MODIFIER
{
	id = BecameCouple
	text = Fell in love with <<2>>
	amount = 15
	durationDays = 60
}
KR_MODIFIER
{
	id = BrokeUp
	text = Broke up with <<2>>
	amount = -20
	durationDays = 60
}
KR_MODIFIER
{
	id = EggLaid
	text = Laid an egg with <<2>>
