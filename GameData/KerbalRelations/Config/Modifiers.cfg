// Scaled up with the strength of the bond: three times this for a best friend, more for a partner.
KR_MODIFIER
{
	id = Grief
	text = Mourning <<2>>
	amount = -10
	durationDays = 90
}
// Lasts for as long as a Kerbal is away from their partner.
KR_MODIFIER
{
	id = MissesPartner
	text = Misses <<2>>
	amount = -10
	durationDays = 1
	noFade = true
}
KR_MODIFIER
{
	id = RibbonEarned
