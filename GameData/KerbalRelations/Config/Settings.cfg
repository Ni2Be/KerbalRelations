// Kerbal Relations - tuning.
// Everything here can be changed with a ModuleManager patch, e.g.
//   @KR_SETTINGS { @GrowthPerDay = 0.5 }
// Days and years follow the calendar chosen in the game settings (Kerbin: 6 h days, 426 day years).
// On/off switches and speed multipliers are per save, under Difficulty Settings > Kerbal Relations.
KR_SETTINGS
{
	// --- Happiness (percent, 0 to 200) ---
	BaseHappiness = 70          // a Kerbal with nothing going on
	LonelyPenalty = 20          // taken off once a Kerbal has been alone for too long
	AloneGraceDays = 10         // how long "too long" is
	CompanyHappiness = 100      // with at least one other Kerbal around
	BondBonusMax = 50           // added on top at a 100 % bond with someone present (so 150 %)
	SocialEaseDays = 3          // how quickly mood follows a change of company
	MinHappiness = 0
	MaxHappiness = 200
	MissPartnerGraceDays = 30   // apart from a partner this long, a Kerbal starts missing them

	// --- Relationships (percent, 0 to 100) ---
	GrowthPerDay = 0.25         // while together; 70 % takes roughly 280 days
	OtherVesselBondCap = 60     // a bond between Kerbals in different vessels right next to each other stops growing here
	FarBondCap = 20             // and here for vessels a full TogetherRange apart; in between it slides from one to the other
	TogetherRange = 2000        // metres within which vessels count as together (the default USI-LS habitation range)
	CompatibilityMin = 0.6      // every pair has a fixed factor in this range: some just click
	CompatibilityMax = 1.4
	DecayGraceDays = 30         // apart this long before a bond starts to fade
	DecayPerDay = 0.05
	CoupleThreshold = 70        // opposite sex, both single: they become a couple
	BreakupThreshold = 50       // a couple falling below this breaks up

	// --- Families ---
	EggThreshold = 85           // a couple this close can lay an egg
	EggCooldownYears = 1        // per couple
	EggMeanWaitDays = 30        // average wait once everything is in place
	EggDurationYears = 0.75     // nine months until it hatches
	ChildDurationYears = 14     // until a child is an adult
	ParentChildStartStrength = 50

	// --- Age and ribbons ---
	HireAgeMinYears = 18        // hired Kerbals are given an age in this range
	HireAgeMaxYears = 45
	EnableRibbons = true
	HomesickYears = 2           // away from home this long: a mission asks to bring them back

	// --- Random mood events ---
	EventMeanIntervalDays = 40  // per Kerbal, on average

	// --- Looks of children and eggs in the cabin ---
	ChildScale = 0.47
	ChildHeadScale = 0.8        // head and helmet, on top of ChildScale
	ChildEyeScale = 1.64        // eyes, on top of the head
	ChildSkinHue = 178          // skin colour of children as a hue in degrees (178 = teal); -1 keeps the green
	ChildSkinHueFemale = 335    // the same for girls (335 = pink); -1 gives girls the colour of the boys
	ChildSkinSaturationFemale = 0.7   // how strong the girls' colour is: 1 is as strong as the green, less is paler
	EggSize = 0.75              // egg height as a fraction of the seated Kerbal it replaces
	EggBallSize = 0.45          // height in metres of an egg that is outside a vessel
	YoungOnEva = true           // your own eggs and children can go outside; false keeps them aboard like tourists

	// Shows test buttons at the bottom of the relationship window.
	Debug = false
}
