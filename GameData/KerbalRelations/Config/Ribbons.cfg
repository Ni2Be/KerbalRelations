// The ribbons Kerbals can earn. What it takes to earn one is fixed; name, text and look can be changed here
// or with a ModuleManager patch.
//   stripes   colours of the cloth from left to right as rrggbb, each with an optional :width; the badge
//             takes the first colour
//   icon      the picture on the badge, one of: smile friends butterfly heart brokenheart hearts ring egg
//             eggs cap tree eggstar cake compass flag house hourglass moon cloud rain candle chevrons star
//             fifty cup book orbit lander hatch
//             or the path of a 16x16 texture of your own, like MyMod/Icons/medal (no file extension)
// Every body also has three ribbons of its own (visited, landed, first born there) in a colour made from
// its name. Other mods can add ribbons with a KR_RIBBON node and hand them out through KerbalRelationsAPI.

KR_RIBBON
{
	id = FirstFriend
	name = First Friend
	description = Reached a bond of 50% with another Kerbal.
	stripes = 3f9b4a:3,f2d24b:1,3f9b4a:3
	icon = smile
}
